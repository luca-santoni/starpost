# Default settings, copied to ~/.config/starpost/settings.yaml on first run.
# User edits the copy (or via the in-app Settings dialog), not this file.

# Path to the starccm+ executable. TODO: set the team's default install path.
starccm_path: ""

license:
  # mode: "podkey_server" (default) | "license_file"
  mode: podkey_server
  podkey: ""                 # Power-on-Demand key  -> -power -podkey <KEY>
  licpath: ""                # license server       -> -licpath <port>@<server>
  license_file: ""           # used only when mode == license_file -> -licpath <file>

# Media rendering: scene stills (Scenes tab → Run) and screenplay movies
# (Screenplays tab → Record). Resolution + magnification passed to
# the render macro's scene.printAndWait call. render_np is the number of cores
# used to render (starccm+ -np): 1 = serial; 2..N partitions a large mesh across
# ranks instead of loading it into one process — faster and less memory per rank.
media:
  magnification: 1
  render_np: 1               # cores for -np; 1 = serial, up to the machine's cores
  scenes_per_checkout: 1     # scenes rendered per license checkout (1 = one each)
  image_format: jpg          # rendered image type: jpg | png
  image_resolution: 1080p    # render resolution: 1080p | 2160p
  # Screenplay recording (Screenplays tab → Record).
  movie_format: mp4          # recorded movie container: mp4 | avi | mov
  movie_fps: 30              # recorded movie frame rate
  movie_resolution: 1080p    # recording resolution: 1080p | 2160p
  movie_quality: high        # encoder quality: low | medium | high
  screenplays_per_checkout: 1  # screenplays recorded per license checkout
  movie_anim_length: 0.0     # recording length in seconds; 0 = each screenplay's own
  movie_start_time: 0.0      # seconds into the animation to start recording

# UI appearance. Changeable in-app via Settings -> Appearance.
appearance:
  mode: dark                 # "dark" | "light"
  accent: "#ffc829"          # hex accent colour applied program-wide
  # Colour of checkmarks (checkboxes, checked menu items) program-wide. When
  # checkmark_match_theme is true the accent colour is used and checkmark_color
  # is ignored.
  checkmark_color: "#ffc829"
  checkmark_match_theme: true
  # Colour of the Files-tab leaf node dots. When node_match_theme is true the
  # accent colour is used and node_color is ignored.
  node_color: "#4a90d9"
  node_match_theme: true

# Default folder for exports (CSV/JPG/PDF). Chosen per-run in the UI; this is the
# starting location of the picker. Empty = user's home.
default_output_dir: ""

# Extra arguments appended verbatim to every starccm+ invocation.
extra_args: []

# Show each loaded .sim with its full path in the Files panel. When false
# (default), only the file name is shown.
show_full_file_names: false

# Number of decimal places shown for report values in the table.
report_decimals: 4

# Hide reports whose value is ~0 from the report table.
hide_empty_reports: true

# Values whose absolute magnitude is below this are treated as 0 (shown as 0 and
# hidden when hide_empty_reports is on).
zero_threshold: 1.0e-5

# Hide monitor plots whose values are all ~0 from the plot view.
hide_empty_monitors: true

# Monitors whose values are all below this absolute magnitude are treated as 0
# (and hidden when hide_empty_monitors is on).
monitor_zero_threshold: 1.0e-5

# Include the monitor's name in the label shown when hovering over a plotted
# line. When false, only the point's coordinates are shown.
hover_show_monitor_name: false

# Number of decimal places shown for the X and Y coordinates in the hover label.
hover_x_decimals: 0
hover_y_decimals: 4

# Opacity of the box drawn behind the plot legend (0.0 = fully transparent,
# 1.0 = solid). Lower values let plot curves show through the legend.
legend_opacity: 0.8

# Statistics listed in the table shown when Shift+dragging a region on the plot.
# Available: Avg, Median, Std Dev, Var, Min, Max, Range. Editable in-app via
# Settings -> Plots -> Statistics.
region_stats: [Avg, Std Dev, Range]

# Plot axis classification heuristics. A monitor plot whose name matches a
# residual keyword gets a log Y axis; force keywords get a linear axis. Any plot
# can be overridden per-plot in the UI or pinned in a profile.
# aggregate_keywords is used by the Convergence tool only: among the monitors
# that match a force keyword, one whose name also matches an aggregate keyword
# (matched as a whole word, e.g. "ALL" does not match "Wall") is preferred as
# the auto-selected primary monitor over its per-element siblings.
plot_classification:
  residual_keywords: [residual, residuals]
  force_keywords: [force, drag, lift, moment, "cd", "cl"]
  aggregate_keywords: [ALL, Total, Sum, Overall, Combined]

# Check GitHub for a newer release when the application starts and offer to
# update if one is available. Toggle in Settings -> Misc.
check_updates_on_startup: true

# Show the "rendering is expensive" warning the first time the Scenes tab is
# opened each session. Cleared when the user ticks "Do not show this again".
show_scenes_warning: true

# Default selections used by the Export dialog. These only pre-fill the dialog's
# controls; the format/theme can still be changed per export. Editable in-app
# via Settings -> Export.
export_report_format: CSV    # report table format: CSV | TSV | XLSX | ODS
export_plot_format: PNG      # plot image format:   PNG | JPG | TIFF | PDF
export_plot_theme: dark      # plot export theme:   "dark" | "light"
